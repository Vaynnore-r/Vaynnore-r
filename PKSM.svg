<svg xmlns="http://w3.org" width="95" height="20" role="img" aria-label="PKSM">
  <clipPath id="r">
    <rect width="95" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#r)">
    <rect width="95" height="20" fill="#007acc"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
    <!-- Pokeball Image Base64 data -->
    <image x="5" y="3" width="14" height="14" href="data:image/png;base64,"/>
    
    <!-- Properly aligned text -->
    <text x="540" y="140" transform="scale(.1)" fill="#fff" textLength="530">PKSM</text>
  </g>
</svg>
